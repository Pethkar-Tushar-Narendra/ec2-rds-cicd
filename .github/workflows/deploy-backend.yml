name: Deploy Backend to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy backend files to EC2
        run: |
          rsync -avz --delete ./backend/ ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/backend/

      - name: Install Node.js and dependencies on EC2
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} 'sudo apt-get update && sudo apt-get install -y nodejs npm && cd /home/ubuntu/backend && npm install'

      - name: Restart backend on EC2
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} 'pkill node || true; cd /home/ubuntu/backend && nohup node index.js &'
