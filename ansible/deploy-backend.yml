---
- name: Deploy Node.js backend on EC2
  hosts: all
  become: yes
  vars:
    node_version: "20.x"
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Node.js
      apt:
        name: nodejs
        state: present

    - name: Install npm
      apt:
        name: npm
        state: present

    - name: Copy backend files
      synchronize:
        src: ../backend/
        dest: /home/ubuntu/backend/
        recursive: yes
        rsync_opts:
          - "--no-group"
          - "--no-times"
          - "--no-perms"
      delegate_to: localhost
      become: false
      # vars removed: ansible_ssh_private_key_file

    - name: Install net-tools
      apt:
        name: net-tools
        state: present

    - name: Install backend dependencies
      shell: |
        cd /home/ubuntu/backend
        npm install
      args:
        executable: /bin/bash

    - name: Ensure backend listens on 0.0.0.0
      lineinfile:
        path: /home/ubuntu/backend/index.js
        regexp: '^app\.listen\(.*\)$'
        line: "app.listen(3000, '0.0.0.0')"
        backrefs: yes
      become: false

    - name: Create systemd service for backend
      copy:
        dest: /etc/systemd/system/backend.service
        content: |
          [Unit]
          Description=Node.js Backend
          After=network.target

          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=/home/ubuntu/backend
          ExecStart=/usr/bin/node /home/ubuntu/backend/index.js
          Restart=always
          Environment=PORT=3000

          [Install]
          WantedBy=multi-user.target
      become: yes

    - name: Reload systemd
      systemd:
        daemon_reload: yes
      become: yes

    - name: Start and enable backend service
      systemd:
        name: backend
        state: started
        enabled: yes
      become: yes
