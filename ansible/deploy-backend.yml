---
- name: Deploy Node.js backend on EC2
  hosts: all
  become: yes
  vars:
    node_version: "20.x"
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Node.js
      apt:
        name: nodejs
        state: present

    - name: Install npm
      apt:
        name: npm
        state: present

    - name: Copy backend files
      synchronize:
        src: ../backend/
        dest: /home/ubuntu/backend/
        recursive: yes
        rsync_opts:
          - "--no-group"
          - "--no-times"
          - "--no-perms"
      delegate_to: localhost
      become: false
      # vars removed: ansible_ssh_private_key_file

    - name: Install backend dependencies
      shell: |
        cd /home/ubuntu/backend
        npm install
      args:
        executable: /bin/bash

    - name: Ensure backend listens on 0.0.0.0
      lineinfile:
        path: /home/ubuntu/backend/index.js
        regexp: '^app\.listen\(.*\)$'
        line: "app.listen(3000, '0.0.0.0')"
        backrefs: yes
      become: false

    - name: Start backend
      shell: |
        cd /home/ubuntu/backend
        nohup node index.js &
      args:
        executable: /bin/bash
